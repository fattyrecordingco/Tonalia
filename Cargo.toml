[workspace]
members = ["crates/tonalia-core", "crates/tonalia-wasm", "src-tauri"]
default-members = ["crates/tonalia-core"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
authors = ["Fatty Recording Co"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
codegen-units = 1
