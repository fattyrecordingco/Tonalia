name: Tonalia website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'apps/web/**'
      - 'crates/**'
      - 'scripts/build-website.mjs'
      - 'scripts/serve-website.mjs'
      - 'tests/website/**'
      - 'playwright.website.config.ts'
      - 'docs/implementation/build-artifacts.json'
      - 'package*.json'
      - 'Cargo.*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build website and editor
        env:
          TONALIA_SITE_BASE: '${{ steps.pages.outputs.base_path }}/'
        run: npm run build:website
      - run: npx playwright install --with-deps chromium
      - name: Check website and real browser editing
        run: npm run test:website
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-test-report
          path: |
            website-test-results/
            website-report/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
